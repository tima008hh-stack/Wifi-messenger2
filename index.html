    <style>
        * {
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            box-sizing: border-box;
        }

        /* 120Hz Анимации */
        @keyframes slideUpFast {
            from { opacity: 0; transform: translate3d(0, 12px, 0) scale(0.98); }
            to { opacity: 1; transform: translate3d(0, 0, 0) scale(1); }
        }
        .animate-slide-up { 
            animation: slideUpFast 0.2s cubic-bezier(0.05, 0.9, 0.1, 1) forwards; 
            will-change: transform, opacity;
        }

        @keyframes fadeInFast {
            from { opacity: 0; transform: scale(0.97); }
            to { opacity: 1; transform: scale(1); }
        }
        .animate-fade-in { 
            animation: fadeInFast 0.2s cubic-bezier(0.05, 0.9, 0.1, 1) forwards; 
            will-change: transform, opacity;
        }

        @keyframes callPulse {
            0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            50% { transform: scale(1.08); box-shadow: 0 0 0 20px rgba(16, 185, 129, 0); }
        }
        .animate-call-pulse {
            animation: callPulse 1.5s infinite cubic-bezier(0.4, 0, 0.6, 1);
        }

        /* Плавные анимации окна звонка */
        @keyframes callModalEnter {
            from { opacity: 0; transform: scale(0.985); }
            to { opacity: 1; transform: scale(1); }
        }
        @keyframes callPanelEnter {
            from { opacity: 0; transform: translateY(18px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .call-modal-enter {
            animation: callModalEnter 220ms cubic-bezier(0.22, 1, 0.36, 1) both;
        }
        #active-call-modal > div:last-child {
            animation: callPanelEnter 260ms cubic-bezier(0.22, 1, 0.36, 1) both;
        }
        #active-call-modal button, #incoming-call-modal button {
            transition: transform 180ms cubic-bezier(0.22, 1, 0.36, 1), background-color 180ms ease, box-shadow 180ms ease;
        }
        #active-call-modal button:active, #incoming-call-modal button:active {
            transform: scale(0.92);
        }
        @media (prefers-reduced-motion: reduce) {
            .call-modal-enter, #active-call-modal > div:last-child {
                animation: none !important;
                transition: none !important;
            }
        }

        /* Полный экран для мобильных */
        html, body {
            width: 100%;
            height: 100%;
            height: 100dvh;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        /* Скроллбар */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(150, 150, 150, 0.25); border-radius: 10px; }

        /* ===== ФИКС СВЕТЛОЙ ТЕМЫ ===== */
        body:not(.dark) {
            background-color: #f1f5f9 !important;
        }
        /* Осветляем фоны панелей */
        body:not(.dark) .bg-slate-950, 
        body:not(.dark) .bg-slate-900,
        body:not(.dark) #settings-modal > div,
        body:not(.dark) #login-modal > div {
            background-color: #ffffff !important;
            border-color: #e2e8f0 !important;
        }
        /* Осветляем инпуты */
        body:not(.dark) input {
            background-color: #f8fafc !important;
            color: #0f172a !important;
            border-color: #cbd5e1 !important;
        }
        /* Делаем текст темным (кроме текста внутри синих/красных кнопок) */
        body:not(.dark) h1, 
        body:not(.dark) h2, 
        body:not(.dark) h3,
        body:not(.dark) label,
        body:not(.dark) .text-slate-100,
        body:not(.dark) .text-slate-300 {
            color: #0f172a !important;
        }
        /* Второстепенный текст */
        body:not(.dark) .text-slate-400 {
            color: #64748b !important;
        }
        /* Осветляем кнопки-иконки и чужие сообщения */
        body:not(.dark) .bg-slate-800 {
            background-color: #f1f5f9 !important;
            border-color: #cbd5e1 !important;
            color: #0f172a !important;
        }
    
/* ===== DESKTOP TELEGRAM-LIKE LAYOUT ===== */

    -webkit-backdrop-filter: blur(14px);

}

}

}

.empty-state-icon { width: 68px; height: 68px; display: grid; place-items: center; border-radius: 22px; color: #60a5fa; background: linear-gradient(145deg, rgba(59,130,246,.16), rgba(99,102,241,.07)); border: 1px solid rgba(96,165,250,.15); box-shadow: 0 18px 50px rgba(37,99,235,.12), inset 0 1px 0 rgba(255,255,255,.06); animation: emptyFloat 3s ease-in-out infinite; }

@keyframes emptyFloat { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-4px)} }

.message-shell { position: relative; }

.call-audio-wave { display:flex; align-items:center; justify-content:center; gap:5px; height:42px; }

.call-audio-wave span:nth-child(1){height:13px;animation-delay:-.4s}.call-audio-wave span:nth-child(2){height:25px;animation-delay:-.25s}.call-audio-wave span:nth-child(3){height:37px;animation-delay:-.1s}.call-audio-wave span:nth-child(4){height:21px;animation-delay:-.32s}.call-audio-wave span:nth-child(5){height:30px;animation-delay:-.18s}
@keyframes callOrb { 0%,100%{transform:scale(1)} 50%{transform:scale(1.035)} }
@keyframes callWave { 0%,100%{transform:scaleY(.55);opacity:.65} 50%{transform:scaleY(1);opacity:1} }

    .message-actions, .typing-indicator, .call-audio-orb, .call-audio-wave span { animation:none !important; transition:none !important; }

.call-avatar-ring { position: relative; }
.call-avatar-ring::before, .call-avatar-ring::after {

<body id="app-body" class="dark bg-slate-950 text-slate-100 font-sans select-none overflow-hidden h-full w-full">

    <!-- Тег для звука входящего звонка -->
    <audio id="remote-audio-player" autoplay playsinline class="hidden"></audio>

    <!-- Окно авторизации (Регистрация / Вход) -->
    <div id="login-modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/90 backdrop-blur-md">
        <div class="w-full max-w-md bg-slate-900 border border-slate-800 p-7 rounded-3xl shadow-2xl animate-fade-in space-y-5">
            <div class="text-center space-y-1">
                <h1 class="text-3xl font-extrabold tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-indigo-400">
                    Мессенджер
                </h1>
                <p class="text-xs text-slate-400" id="auth-subtitle">Войдите в аккаунт или зарегистрируйтесь</p>
            </div>

            <!-- Вкладки: Вход / Регистрация -->
            <div class="flex bg-slate-950 p-1 rounded-2xl border border-slate-800">
                <button type="button" id="tab-login" class="flex-1 py-2 rounded-xl text-xs font-bold transition bg-blue-600 text-white shadow-md">
                    Вход
                </button>
                <button type="button" id="tab-register" class="flex-1 py-2 rounded-xl text-xs font-bold transition text-slate-400 hover:text-white">
                    Регистрация
                </button>
            </div>
            
            <!-- Форма входа -->
            <form id="form-login" class="space-y-3.5">
                <div>
                    <label class="text-xs font-medium text-slate-300 ml-1">Личный ID</label>
                    <input type="text" id="login-id" placeholder="Например: ivan777" required
                        class="w-full bg-slate-950 border border-slate-800 rounded-2xl p-3 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-blue-500 transition-all mt-1">
                </div>

                <div>
                    <label class="text-xs font-medium text-slate-300 ml-1">Пароль</label>
                    <input type="password" id="login-password" placeholder="Введи пароль" required
                        class="w-full bg-slate-950 border border-slate-800 rounded-2xl p-3 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-blue-500 transition-all mt-1">
                </div>

                <button type="submit" 
                    class="w-full bg-blue-600 hover:bg-blue-500 active:scale-[0.98] font-semibold p-3.5 rounded-2xl transition text-sm text-white shadow-lg shadow-blue-600/20 mt-2">
                    Войти в аккаунт
                </button>
            </form>

            <!-- Форма регистрации -->
            <form id="form-register" class="space-y-3.5 hidden">
                <div>
                    <label class="text-xs font-medium text-slate-300 ml-1">Личный ID (уникальный)</label>
                    <input type="text" id="reg-id" placeholder="Например: ivan777" required
                        class="w-full bg-slate-950 border border-slate-800 rounded-2xl p-3 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-blue-500 transition-all mt-1">
                </div>

                <div>
                    <label class="text-xs font-medium text-slate-300 ml-1">Твоё имя</label>
                    <input type="text" id="reg-name" placeholder="Например: Иван" required
                        class="w-full bg-slate-950 border border-slate-800 rounded-2xl p-3 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-blue-500 transition-all mt-1">
                </div>

                <div>
                    <label class="text-xs font-medium text-slate-300 ml-1">Придумай пароль</label>
                    <input type="password" id="reg-password" placeholder="Пароль" required
                        class="w-full bg-slate-950 border border-slate-800 rounded-2xl p-3 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-blue-500 transition-all mt-1">
                </div>

                <div id="login-status" class="hidden text-xs text-center p-2 rounded-xl bg-blue-500/20 text-blue-300 border border-blue-500/30 animate-pulse">
                    Проверка ID...
                </div>

                <button type="submit" 
                    class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 active:scale-[0.98] font-semibold p-3.5 rounded-2xl transition text-sm text-white shadow-lg shadow-blue-600/20 mt-2">
                    Зарегистрироваться
                </button>
            </form>
        </div>
    </div>

    <script>
        function censorText(text) {
            const badWordsPatterns = [
                /хуй[яиеюаммиыовлдезс]?/gi, /пизд[аеыоуияюаммивлдезс]?/gi,
                /еб[аеиоултщсйбммяюаммивлдезс]?/gi, /еб [а-я]+/gi,
                /бля[тдбвлдезс]?/gi, /сук[аиоеаммивлдезс]?/gi,
                /гандон[аммивлдезс]?/gi, /мудак[аммивлдезс]?/gi,
                /пидор[асиоеаммивлдезс]?/gi, /залуп[аеыоуияюаммивлдезс]?/gi, /чм[оауеы]?/gi
            ];
            let result = text;
            badWordsPatterns.forEach(pattern => {
                result = result.replace(pattern, (match) => match.charAt(0) + '*'.repeat(match.length - 1));
            });
            return result;
        }

        const notifyAudio = new Audio('./notification.mp3');
        function playNotificationSound() {
            notifyAudio.currentTime = 0;
            notifyAudio.play().catch(() => playFallbackSound());
        }

        function playFallbackSound() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();

                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(587.33, audioCtx.currentTime);
                oscillator.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.08);

                gainNode.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);

                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);

                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 0.2);
            } catch (e) {}
        }

        // --- ПРЕМИАЛЬНЫЕ ГУДКИ: Web Audio, без внешних mp3 ---
        let outgoingToneInterval = null;
        let ringAudioCtx = null;
        let activeToneNodes = [];

        function ensureRingAudio() {
            if (!ringAudioCtx) ringAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (ringAudioCtx.state === 'suspended') ringAudioCtx.resume().catch(() => {});
            return ringAudioCtx;
        }

        function stopToneNodes() {
            activeToneNodes.forEach(n => { try { n.stop(); } catch(e) {} });
            activeToneNodes = [];
        }

        function tone(freq, start, duration, volume = 0.055, type = 'sine') {
            const ctx = ensureRingAudio();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, start);
            gain.gain.setValueAtTime(0.0001, start);
            gain.gain.exponentialRampToValueAtTime(volume, start + 0.035);
            gain.gain.exponentialRampToValueAtTime(0.0001, start + duration);
            osc.connect(gain); gain.connect(ctx.destination);
            osc.start(start); osc.stop(start + duration + 0.03);
            activeToneNodes.push(osc);
        }

        function playIncomingRing() {
            const ctx = ensureRingAudio();
            const now = ctx.currentTime + 0.03;
            // Двойной мягкий гудок: заметный, но не раздражающий.
            tone(440, now, 0.62, 0.065);
            tone(660, now, 0.62, 0.045);
            tone(440, now + 0.82, 0.62, 0.065);
            tone(660, now + 0.82, 0.62, 0.045);
        }

        function startRingtone() {
            stopRingtone();
            try {
                playIncomingRing();
                outgoingToneInterval = setInterval(playIncomingRing, 3200);
            } catch(e) {}
        }

        function stopRingtone() {
            if (outgoingToneInterval) { clearInterval(outgoingToneInterval); outgoingToneInterval = null; }
            stopToneNodes();
        }

        function startOutgoingTone() {
            stopOutgoingTone();
            try {
                const playRingback = () => {
                    const ctx = ensureRingAudio();
                    const now = ctx.currentTime + 0.03;
                    tone(425, now, 1.05, 0.045);
                    tone(425, now + 1.08, 1.05, 0.045);
                };
                playRingback();
                outgoingToneInterval = setInterval(playRingback, 4200);
            } catch(e) {}
        }

        function stopOutgoingTone() {
            if (outgoingToneInterval) { clearInterval(outgoingToneInterval); outgoingToneInterval = null; }
            stopToneNodes();
        }

            let hash = 0;
            for (let i = 0; i < name.length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);

        }

        function formatBytes(bytes) {
            if (bytes === 0) return '0 Б';
            const k = 1024;
            const sizes = ['Б', 'КБ', 'МБ', 'ГБ'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
        }

        function connectMQTT() {
            client = mqtt.connect('wss://broker.hivemq.com:8884/mqtt', {
                clientId: 'tg_' + myId.replace(/[^a-zA-Z0-9_-]/g, '_'),
                clean: false,
                reconnectPeriod: 1000,
                connectTimeout: 10000,
                keepalive: 30
            });

            client.on('connect', () => {
                client.subscribe('direct_msg_' + myId, { qos: 1 });
                client.subscribe('message_status_' + myId, { qos: 1 });
                client.subscribe('typing_' + myId, { qos: 1 });
                client.subscribe('check_id_' + myId);
                client.subscribe('call_signal_' + myId);

                setInterval(() => {
                    if (currentChat && currentChat.type === 'room') {
                        client.publish('custom_room_' + currentChat.id, JSON.stringify({ type: 'ping', id: myId, name: myName }));
                        cleanUsers();
                    }
                }, 2000);
            });

            client.on('message', (topic, msg) => {
                let data = JSON.parse(msg.toString());

                if (topic === 'check_id_' + myId && data.action === 'ping') {
                    client.publish('check_response_' + myId, JSON.stringify({ action: 'pong' }));
                    return;
                }

                if (topic === 'message_status_' + myId) {
                    handleMessageStatus(data);
                    return;
                }

                if (topic === 'typing_' + myId) {
                    handleTypingSignal(data);
                    return;
                }

                if (topic === 'message_reaction_' + myId) {
                    handleReactionSignal(data);
                    return;
                }

                if (topic === 'call_signal_' + myId) {
                    handleCallSignal(data);
                    return;
                }

                if (topic.startsWith('custom_room_')) {
                    const roomId = topic.replace('custom_room_', '');
                    if (data.type === 'reaction') {
                        handleReactionSignal(data, roomId);
                        return;
                    }

                    if (data.type === 'ping') {
                        onlineUsers.set(data.id, { name: data.name, time: Date.now() });
                        renderUsers();
                        return;
                    }

                    if (data.senderId !== myId) {
                        saveAndAddMessage(roomId, data.senderName, data.content, false, data.msgType, data.avatar, data.fileName, data.fileSize);
                        
                        if (!currentChat || currentChat.id !== roomId || currentChat.type !== 'room') {
                            incrementUnread(roomId);
                        }
                        playNotificationSound();
                    }
                }

                if (topic === 'direct_msg_' + myId) {
                    const senderId = data.senderId;
                    const messageId = data.messageId || ('legacy_' + Date.now() + '_' + Math.random().toString(36).slice(2));

                    if (!friends.some(f => f.id === senderId)) {
                        friends.push({ id: senderId, name: data.senderName, avatar: data.avatar });
                        saveContacts();
                        renderSidebarChats();
                    }

                    const isOpen = currentChat && currentChat.id === senderId && currentChat.type === 'direct';
                    saveMessageToStorage(senderId, data.senderName, data.content, false, data.msgType, data.avatar, data.fileName, data.fileSize, messageId, senderId, isOpen ? 'read' : 'delivered');

                    // Сообщение физически дошло до клиента: 2 серые галочки.
                    publishMessageStatus(senderId, messageId, 'delivered');

                    if (isOpen) {
                        renderMessageDOM(data.senderName, data.content, false, data.msgType, data.avatar, data.fileName, data.fileSize, true, messageId, 'read');
                        // Чат открыт — сразу подтверждаем прочтение: 2 синие.
                        publishMessageStatus(senderId, messageId, 'read');
                    } else {
                        incrementUnread(senderId);
                    }
                    playNotificationSound();
                }
            });
        }

        // Поиск и фильтры списка чатов в стиле Telegram Desktop
        let activeChatFilter = 'all';
        let activeChatSearch = '';

        function applyChatFilters() {
            const query = activeChatSearch.trim().toLowerCase();
            document.querySelectorAll('#chats-list .tg-chat-item').forEach(item => {

                item.style.display = matchesSearch && matchesType ? '' : 'none';
            });
            document.querySelectorAll('#chats-list .tg-section-label').forEach(label => {
                const section = label.textContent.includes('Комнаты') ? 'room' : 'direct';
                const visible = [...label.parentElement.querySelectorAll('.tg-chat-item')].some(x => x.style.display !== 'none');
                label.style.display = (activeChatFilter === 'all' || activeChatFilter === section) && visible ? '' : 'none';
            });
        }

        let typingPublishTimer = null;

        function publishTyping(active) {
            if (!currentChat || currentChat.type !== 'direct' || !client || !client.connected) return;
            try {
                client.publish('typing_' + currentChat.id, JSON.stringify({
                    from: myId, name: myName, active: !!active

        function handleTypingSignal(data) {
            if (!data || data.from === myId || !data.from) return;
            if (!currentChat || currentChat.type !== 'direct' || data.from !== currentChat.id) return;
            if (data.active) {
                remoteTyping.set(data.from, data.name || 'Собеседник');
                updateChatHeaderSubtitle();
                clearTimeout(typingTimers.get(data.from));
                typingTimers.set(data.from, setTimeout(() => clearTyping(data.from), 2500));
            } else {
                clearTyping(data.from);
            }
        }

        const typingTimers = new Map();
        function clearTyping(userId) {
            clearTimeout(typingTimers.get(userId));
            typingTimers.delete(userId);
            remoteTyping.delete(userId);
            updateChatHeaderSubtitle();
        }

            currentChat = { id, name, type };
            clearUnread(id);

            if (window.innerWidth < 768) document.getElementById('sidebar').classList.add('hidden');

            updateChatHeaderSubtitle();
            
            const avatar = document.getElementById('active-avatar');
            avatar.textContent = type === 'direct' ? name.charAt(0).toUpperCase() : '#';
            avatar.className = `w-10 h-10 rounded-2xl flex items-center justify-center font-bold text-sm shadow-md ${type === 'direct' ? getColorForName(name) : 'bg-purple-600 text-white'}`;

            const roomUsersContainer = document.getElementById('room-users-container');
            const callButtonsContainer = document.getElementById('call-buttons-container');

            if (type === 'room') {
                roomUsersContainer.classList.remove('hidden');
                callButtonsContainer.classList.add('hidden');
                client.subscribe('custom_room_' + id);
            } else {
                roomUsersContainer.classList.add('hidden');
                callButtonsContainer.classList.remove('hidden');
            }

            loadChatHistory();
        }

        function getStorageKey(chatId, type = 'direct') {
            return `chat_history_${type}_${chatId}_${myId}`;
        }

        function loadChatHistory() {
            const box = document.getElementById('messages');
            box.innerHTML = '';
            if (!currentChat) return;

            const key = getStorageKey(currentChat.id, currentChat.type);
            try {
                const rawData = localStorage.getItem(key);
                if (!rawData) return;
                const data = JSON.parse(rawData);

                data.messages.forEach(m => {
                    const status = m.isMe ? (m.status || 'sent') : m.status;
                    renderMessageDOM(m.author, m.content, m.isMe, m.type, m.avatar, m.fileName, m.fileSize, false, m.messageId, status, m.reactions || {});
                });
                box.scrollTop = box.scrollHeight;

                // Все входящие, находящиеся в открытом чате, считаем прочитанными.
                if (currentChat.type === 'direct') {
                    data.messages.filter(m => !m.isMe && m.messageId && m.status !== 'read').forEach(m => {
                        m.status = 'read';
                        publishMessageStatus(currentChat.id, m.messageId, 'read');
                    });
                    localStorage.setItem(key, JSON.stringify(data));
                    clearUnread(currentChat.id);
                }
            } catch (e) {}
        }

        function saveMessageToStorage(chatId, author, content, isMe, type, avatar, fileName, fileSize, messageId = null, senderId = null, status = null) {
            try {
                const key = getStorageKey(chatId, (isMe ? (currentChat?.id === chatId ? currentChat.type : 'direct') : 'direct'));
                const rawData = localStorage.getItem(key);
                const chatData = rawData ? JSON.parse(rawData) : { timestamp: Date.now(), messages: [] };

                const msg = {
                    author, content, isMe, type, avatar, fileName, fileSize,
                    messageId: messageId || makeMessageId(),
                    senderId: senderId || (isMe ? myId : chatId),
                    status: status || (isMe ? 'sent' : 'delivered'),
                    reactions: {},
                    createdAt: Date.now()
                };
                chatData.messages.push(msg);
                if (chatData.messages.length > 500) chatData.messages.shift();

                localStorage.setItem(key, JSON.stringify(chatData));
                return msg;
            } catch (e) { return null; }
        }

        function saveAndAddMessage(chatId, author, content, isMe, type, avatar, fileName, fileSize, messageId = null, status = null) {
            const saved = saveMessageToStorage(chatId, author, content, isMe, type, avatar, fileName, fileSize, messageId, isMe ? myId : chatId, status);
            if (currentChat && currentChat.id === chatId) {
                renderMessageDOM(author, content, isMe, type, avatar, fileName, fileSize, true, saved?.messageId, saved?.status);
            }
            return saved;
        }

        function updateStoredMessageStatus(chatId, messageId, status) {
            if (!messageId) return;
            try {
                const key = getStorageKey(chatId, 'direct');
                const raw = localStorage.getItem(key);
                if (!raw) return;
                const data = JSON.parse(raw);
                const msg = data.messages.find(m => m.messageId === messageId);
                if (msg) {
                    const rank = { sent: 0, delivered: 1, read: 2 };
                    if ((rank[status] ?? 0) >= (rank[msg.status] ?? 0)) {
                        msg.status = status;
                        localStorage.setItem(key, JSON.stringify(data));
                    }
                }
            } catch (e) {}
        }

        function publishMessageStatus(recipientId, messageId, status) {
            if (!client || !recipientId || !messageId) return;
            client.publish('message_status_' + recipientId, JSON.stringify({
                messageId, status, chatId: myId, from: myId
            }), { qos: 1 });
        }

        function handleMessageStatus(data) {
            if (!data || !data.messageId || !data.status) return;
            // Статусы применяем только вперёд: отправлено -> доставлено -> прочитано.
            const chatId = data.chatId || data.from;
            updateStoredMessageStatus(chatId, data.messageId, data.status);
            const el = document.querySelector(`[data-message-id="${CSS.escape(data.messageId)}"]`);
            if (el) {
                const statusEl = el.querySelector('.message-status');
                if (statusEl) {
                    statusEl.dataset.status = data.status;
                    statusEl.innerHTML = messageStatusHTML(data.status);
                }
            }
        }

        function messageStatusHTML(status = 'sent') {
            if (status === 'read') {
                return '<span class="message-status-icon text-sky-200" title="Прочитано">✓✓</span>';
            }
            if (status === 'delivered') {
                return '<span class="message-status-icon text-slate-300" title="Доставлено">✓✓</span>';
            }
            return '<span class="message-status-icon text-white/75" title="Отправлено">✓</span>';
        }

        fileInput.onchange = (e) => {
            const file = e.target.files[0];
            if (!file || !currentChat) return;

            if (file.size > 15 * 1024 * 1024) {
                return alert('Файл слишком большой! Максимальный размер 15 МБ.');
            }

            const fileName = file.name;
            const fileSize = file.size;
            const mimeType = file.type;

            const reader = new FileReader();
            reader.onload = (event) => {
                let msgType = 'file';
                let content = event.target.result;

                if (mimeType.startsWith('image/')) {
                    msgType = 'image';
                } else if (mimeType.startsWith('video/')) {
                    msgType = 'video';
                } else if (mimeType.startsWith('audio/')) {
                    msgType = 'audio';
                }

                if (msgType === 'image') {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;
                        const MAX_WIDTH = 800;
                        const MAX_HEIGHT = 800;

                        if (width > height) {
                            if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
                        } else {
                            if (height > MAX_HEIGHT) { width *= MAX_HEIGHT / height; height = MAX_HEIGHT; }
                        }

                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);

                        const compressedBase64 = canvas.toDataURL('image/jpeg', 0.75);
                        sendPayload(compressedBase64, 'image', fileName, fileSize);
                    };
                    img.src = content;
                } else {
                    sendPayload(content, msgType, fileName, fileSize);
                }

                fileInput.value = '';
            };
            reader.readAsDataURL(file);
        };

        function sendPayload(content, msgType, fileName, fileSize) {
            const messageId = makeMessageId();
            const msgData = {
                senderId: myId, 
                senderName: myName, 
                content: content, 
                msgType: msgType, 
                avatar: myCustomAvatar,
                fileName: fileName,
                fileSize: fileSize,
                messageId
            };

            if (currentChat.type === 'direct') {
                client.publish('direct_msg_' + currentChat.id, JSON.stringify(msgData), { qos: 1 });
            } else {
                client.publish('custom_room_' + currentChat.id, JSON.stringify(msgData));
            }

            saveAndAddMessage(currentChat.id, myName, content, true, msgType, myCustomAvatar, fileName, fileSize, messageId, 'sent');
        }

        function normalizeReactions(reactions) {
            const out = {};
            if (!reactions || typeof reactions !== 'object') return out;
            Object.entries(reactions).forEach(([emoji, users]) => {
                if (!Array.isArray(users)) return;
                const unique = [...new Set(users.filter(Boolean))];
                if (unique.length) out[emoji] = unique;
            });
            return out;
        }

        function reactionSummaryHTML(reactions = {}) {
            const normalized = normalizeReactions(reactions);
            return Object.entries(normalized).map(([emoji, users]) => {
                const mine = users.includes(myId) ? ' mine' : '';
                return `<button type="button" class="message-reaction-chip${mine}" data-reaction-chip="${emoji}" title="${users.length} реакций"><span>${emoji}</span><span>${users.length}</span></button>`;
            }).join('');
        }

        function findStoredMessage(chatId, type, messageId) {
            if (!chatId || !messageId) return null;
            try {
                const key = getStorageKey(chatId, type);
                const raw = localStorage.getItem(key);
                if (!raw) return null;
                const data = JSON.parse(raw);
                const message = data.messages.find(m => m.messageId === messageId);
                return message ? { key, data, message } : null;
            } catch (e) { return null; }
        }

        function updateReactionDOM(messageId, reactions) {
            const el = document.querySelector(`[data-message-id="${CSS.escape(messageId)}"]`);
            if (!el) return;
            const list = el.querySelector('.message-reaction-list');
            if (list) list.innerHTML = reactionSummaryHTML(reactions);
            bindReactionButtons(el);
        }

        function bindReactionButtons(root) {
            root.querySelectorAll('.message-action-btn').forEach(btn => {
                if (btn.dataset.bound === '1') return;
                btn.dataset.bound = '1';
                btn.addEventListener('click', () => toggleReaction(btn.dataset.messageId, btn.dataset.emoji));
            });
            root.querySelectorAll('.message-reaction-chip').forEach(btn => {
                if (btn.dataset.bound === '1') return;
                btn.dataset.bound = '1';
                btn.addEventListener('click', () => toggleReaction(btn.closest('[data-message-id]')?.dataset.messageId, btn.dataset.reactionChip));
            });
        }

        function applyReactionLocally(chatId, chatType, messageId, emoji, userId, active) {
            const found = findStoredMessage(chatId, chatType, messageId);
            if (!found) return null;
            const reactions = normalizeReactions(found.message.reactions || {});
            const users = new Set(reactions[emoji] || []);
            if (active) users.add(userId); else users.delete(userId);
            if (users.size) reactions[emoji] = [...users]; else delete reactions[emoji];
            found.message.reactions = reactions;
            localStorage.setItem(found.key, JSON.stringify(found.data));
            updateReactionDOM(messageId, reactions);
            return reactions;
        }

        function toggleReaction(messageId, emoji) {
            if (!currentChat || !messageId || !emoji) return;
            const found = findStoredMessage(currentChat.id, currentChat.type, messageId);
            if (!found) return;
            const reactions = normalizeReactions(found.message.reactions || {});
            const users = reactions[emoji] || [];
            const active = !users.includes(myId);
            const updated = applyReactionLocally(currentChat.id, currentChat.type, messageId, emoji, myId, active);
            const payload = JSON.stringify({ type:'reaction', messageId, emoji, userId:myId, active, chatId:currentChat.id, from:myId });
            try {
                if (currentChat.type === 'direct') client.publish('message_reaction_' + currentChat.id, payload, { qos: 1 });
                else client.publish('custom_room_' + currentChat.id, payload, { qos: 1 });
            } catch (e) {}
            return updated;
        }

        function handleReactionSignal(data, roomId = null) {
            if (!data || data.type !== 'reaction' || data.userId === myId || !data.messageId || !data.emoji) return;

            // Для ЛС ключ истории хранится по ID СОБЕСЕДНИКА.
            // Реакция приходит на topic получателя, поэтому data.chatId указывает
            // на получателя реакции, а нам нужен data.from — автор реакции.
            const isRoom = !!roomId;
            const chatId = isRoom ? roomId : data.from;
            if (!chatId) return;

            applyReactionLocally(chatId, isRoom ? 'room' : 'direct', data.messageId, data.emoji, data.userId, !!data.active);
        }

        // --- Надёжные WebRTC-звонки: STUN + TURN + ICE restart ---
        let peerConnection = null;
        let localStream = null;
        let callTargetId = null;
        let iceCandidatesQueue = [];
        let pendingCallOffer = null;
        let callClosing = false;
        let iceRestartInProgress = false;
        let callStartedAt = null;
        let callTimerInterval = null;

        // TURN нужен для сетей, где прямое P2P-соединение невозможно
        // (мобильный интернет, CGNAT, строгий NAT/Firewall).
        const rtcConfig = {
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' },
                {
                    urls: [
                        'turn:openrelay.metered.ca:80',
                        'turn:openrelay.metered.ca:443?transport=tcp',
                        'turns:openrelay.metered.ca:443?transport=tcp'
                    ],
                    username: 'openrelayproject',
                    credential: 'openrelayproject'
                }
            ],
            bundlePolicy: 'max-bundle',
            rtcpMuxPolicy: 'require',
            iceCandidatePoolSize: 10
        };

        function setCallStatus(text) {
            const el = document.getElementById('call-status-timer');
            if (el) el.textContent = text;
        }

        function startCallTimer() {
            callStartedAt = Date.now();
            clearInterval(callTimerInterval);
            callTimerInterval = setInterval(() => {
                if (!callStartedAt) return;
                const seconds = Math.floor((Date.now() - callStartedAt) / 1000);
                const h = String(Math.floor(seconds / 3600)).padStart(2, '0');
                const m = String(Math.floor((seconds % 3600) / 60)).padStart(2, '0');
                const sec = String(seconds % 60).padStart(2, '0');
                setCallStatus(h === '00' ? `${m}:${sec}` : `${h}:${m}:${sec}`);
            }, 1000);
        }

        function stopCallTimer() {
            clearInterval(callTimerInterval);
            callTimerInterval = null;
            callStartedAt = null;
        }

        function showActiveCall() {
            const modal = document.getElementById('active-call-modal');
            modal.classList.remove('hidden');
            modal.classList.remove('call-modal-enter');
            void modal.offsetWidth;
            modal.classList.add('call-modal-enter');
        }

        function showIncomingCall() {
            const modal = document.getElementById('incoming-call-modal');
            modal.classList.remove('hidden');
            modal.classList.remove('call-modal-enter');
            void modal.offsetWidth;
            modal.classList.add('call-modal-enter');
        }

        function initWebRTC() {
            document.getElementById('start-voice-call-btn').onclick = () => startCall();
            document.getElementById('end-call-btn').onclick = () => endCall(true);
            document.getElementById('reject-call-btn').onclick = rejectCall;
            document.getElementById('accept-call-btn').onclick = acceptCall;

            document.getElementById('toggle-mic-btn').onclick = () => {
                if (!localStream) return;
                const audioTrack = localStream.getAudioTracks()[0];
                if (!audioTrack) return;
                audioTrack.enabled = !audioTrack.enabled;
                document.getElementById('toggle-mic-btn').classList.toggle('is-off', !audioTrack.enabled);
                if (!audioTrack.enabled) { const r = document.getElementById('call-mic-level-rect'); if (r) { r.setAttribute('y', '24'); r.setAttribute('height', '0'); } }
            };
        }

        function publishCallSignal(data) {
            if (!client || !client.connected || !callTargetId) return false;
            try {
                client.publish('call_signal_' + callTargetId, JSON.stringify(data), { qos: 1 });
                return true;
            } catch (e) {
                return false;
            }
        }
        async function startCall() {
            if (!currentChat || currentChat.type !== 'direct') {
                return alert('Звонить можно только другу в ЛС!');
            }
            if (peerConnection || localStream || callTargetId) return;
            if (!client || !client.connected) return alert('Нет соединения с сервером. Подожди пару секунд и попробуй снова.');

            callClosing = false;
            callTargetId = currentChat.id;
            iceCandidatesQueue = [];

            showActiveCall();
            document.getElementById('active-call-name').textContent = currentChat.name;
            setCallStatus('Подключение...');
            startOutgoingTone();

            try {
                localStream = await navigator.mediaDevices.getUserMedia({
                    audio: {
                        echoCancellation: true,
                        noiseSuppression: true,
                        autoGainControl: true,
                        channelCount: 1,
                        sampleRate: 48000
                    }
                });
                startMicLevelMeter(localStream, 'call');

                createPeerConnection();
                localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

                const offer = await peerConnection.createOffer();
                await peerConnection.setLocalDescription(offer);

                publishCallSignal({
                    type: 'offer',
                    offer: peerConnection.localDescription,
                    from: myId,
                    fromName: myName,
                    callMode: 'audio'
                });
                setCallStatus('Вызов...');
            } catch (err) {
                console.error('startCall:', err);
                alert('Не удалось получить доступ к микрофону. Проверь разрешения браузера и HTTPS.');
                endCall(false);
            }
        }

        function createPeerConnection() {
            if (peerConnection) {
                try { peerConnection.close(); } catch (e) {}
            }

            peerConnection = new RTCPeerConnection(rtcConfig);

            peerConnection.onicecandidate = (event) => {
                if (event.candidate && callTargetId && !callClosing) {
                    publishCallSignal({
                        type: 'candidate',
                        candidate: event.candidate,
                        from: myId
                    });
                }
            };

            peerConnection.onicecandidateerror = (event) => {
                console.warn('ICE candidate error:', event.errorCode, event.errorText);
            };

            peerConnection.oniceconnectionstatechange = () => {
                if (!peerConnection || callClosing) return;
                const state = peerConnection.iceConnectionState;
                if (state === 'checking') setCallStatus('Соединение...');
                if (state === 'connected' || state === 'completed') {
                    stopOutgoingTone();
                    startCallTimer();
                }
                if (state === 'disconnected') {
                    setCallStatus('Переподключение...');
                    scheduleIceRestart();
                }
                if (state === 'failed') {
                    setCallStatus('Восстановление соединения...');
                    scheduleIceRestart(true);
                }
            };

            peerConnection.onconnectionstatechange = () => {
                if (!peerConnection || callClosing) return;
                const state = peerConnection.connectionState;
                if (state === 'connected') {
                    stopOutgoingTone();
                    stopRingtone();
                    startCallTimer();
                    setCallStatus('00:00');
                } else if (state === 'failed') {
                    scheduleIceRestart(true);
                } else if (state === 'disconnected') {
                    setCallStatus('Переподключение...');
                }
            };

            peerConnection.ontrack = (event) => {
                stopRingtone();
                stopOutgoingTone();

                const stream = event.streams && event.streams[0];
                if (!stream) return;
                const remoteAudio = document.getElementById('remote-audio-player');
                remoteAudio.srcObject = stream;
                remoteAudio.play().catch(() => {});

                if (!callStartedAt) startCallTimer();
                setCallStatus('00:00');
            };

            peerConnection.onnegotiationneeded = () => {};
        }

        let iceRestartTimer = null;
        function scheduleIceRestart(force = false) {
            if (callClosing || iceRestartInProgress || !peerConnection || !callTargetId) return;
            clearTimeout(iceRestartTimer);
            iceRestartTimer = setTimeout(() => restartIceConnection(force), force ? 300 : 1500);
        }

        async function restartIceConnection(force = false) {
            if (callClosing || iceRestartInProgress || !peerConnection || !callTargetId) return;
            if (!force && !['disconnected', 'failed'].includes(peerConnection.iceConnectionState)) return;

            iceRestartInProgress = true;
            try {
                const offer = await peerConnection.createOffer({ iceRestart: true });
                await peerConnection.setLocalDescription(offer);
                publishCallSignal({
                    type: 'ice-restart-offer',
                    offer: peerConnection.localDescription,
                    from: myId,
                    fromName: myName
                });
            } catch (e) {
                console.warn('ICE restart failed:', e);
            } finally {
                iceRestartInProgress = false;
            }
        }

        function handleCallSignal(data) {
            if (!data || !data.type || data.from === myId) return;

            if (data.type === 'offer' || data.type === 'ice-restart-offer') {
                if (data.type === 'ice-restart-offer' && peerConnection && localStream) {
                    handleIceRestartOffer(data);
                    return;
                }

                if (peerConnection || localStream) return;
                pendingCallOffer = data;
                callTargetId = data.from;

                document.getElementById('caller-name').textContent = data.fromName || data.from;
                document.getElementById('call-type-label').textContent = 'Входящий аудиозвонок…';
                showIncomingCall();
                startRingtone();
                return;
            }

            if (data.type === 'answer') {
                stopOutgoingTone();
                if (!peerConnection) return;
                peerConnection.setRemoteDescription(new RTCSessionDescription(data.answer))
                    .then(processIceCandidates)
                    .catch(e => console.warn('setRemoteDescription(answer):', e));
                return;
            }

            if (data.type === 'candidate') {
                if (!peerConnection || !peerConnection.remoteDescription) {
                    iceCandidatesQueue.push(data.candidate);
                } else {
                    peerConnection.addIceCandidate(new RTCIceCandidate(data.candidate)).catch(e => {
                        console.warn('addIceCandidate:', e);
                    });
                }
                return;
            }

            if (data.type === 'reject') {
                endCall(false);
                return;
            }

            if (data.type === 'end') {
                endCall(false);
                return;
            }
        }

        async function handleIceRestartOffer(data) {
            if (!peerConnection) return;
            try {
                await peerConnection.setRemoteDescription(new RTCSessionDescription(data.offer));
                processIceCandidates();
                const answer = await peerConnection.createAnswer();
                await peerConnection.setLocalDescription(answer);
                publishCallSignal({ type: 'answer', answer: peerConnection.localDescription, from: myId });
            } catch (e) {
                console.warn('ICE restart answer:', e);
            }
        }

        function processIceCandidates() {
            if (!peerConnection || !peerConnection.remoteDescription) return;
            while (iceCandidatesQueue.length) {
                const candidate = iceCandidatesQueue.shift();
                peerConnection.addIceCandidate(new RTCIceCandidate(candidate)).catch(() => {});
            }
        }

        async function acceptCall() {
            stopRingtone();
            stopOutgoingTone();
            document.getElementById('incoming-call-modal').classList.add('hidden');
            if (!pendingCallOffer || !callTargetId) return;

            callClosing = false;
            showActiveCall();
            document.getElementById('active-call-name').textContent = pendingCallOffer.fromName || pendingCallOffer.from;
            setCallStatus('Подключение...');

            try {
                localStream = await navigator.mediaDevices.getUserMedia({
                    audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true, channelCount: 1, sampleRate: 48000 }
                });
                startMicLevelMeter(localStream, 'call');

                createPeerConnection();
                localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

                await peerConnection.setRemoteDescription(new RTCSessionDescription(pendingCallOffer.offer));
                processIceCandidates();

                const answer = await peerConnection.createAnswer();
                await peerConnection.setLocalDescription(answer);

                publishCallSignal({
                    type: 'answer',
                    answer: peerConnection.localDescription,
                    from: myId
                });
                setCallStatus('Соединение...');
                pendingCallOffer = null;
            } catch (err) {
                console.error('acceptCall:', err);
                alert('Не удалось подключить микрофон. Проверь разрешение браузера.');
                rejectCall();
            }
        }

        function rejectCall() {
            stopRingtone();
            stopOutgoingTone();
            document.getElementById('incoming-call-modal').classList.add('hidden');
            publishCallSignal({ type: 'reject', from: myId });
            pendingCallOffer = null;
            callTargetId = null;
            iceCandidatesQueue = [];
        }

        function endCall(notifyPeer = true) {
            if (callClosing) return;
            callClosing = true;

            const target = callTargetId;
            if (notifyPeer && target && client && client.connected) {
                try {
                    client.publish('call_signal_' + target, JSON.stringify({ type: 'end', from: myId }), { qos: 1 });
                } catch (e) {}
            }

            stopRingtone();
            stopOutgoingTone();
            stopCallTimer();
            clearTimeout(iceRestartTimer);
            iceRestartTimer = null;
            iceRestartInProgress = false;

            document.getElementById('active-call-modal').classList.add('hidden');
            document.getElementById('incoming-call-modal').classList.add('hidden');

            if (peerConnection) {
                try { peerConnection.ontrack = null; peerConnection.onicecandidate = null; peerConnection.close(); } catch (e) {}
                peerConnection = null;
            }

            if (localStream) {
                stopMicLevelMeter();
                localStream.getTracks().forEach(track => {
                    try { track.stop(); } catch (e) {}
                });
                localStream = null;
            }

            const remoteAudio = document.getElementById('remote-audio-player');
            remoteAudio.pause();
            remoteAudio.srcObject = null;

            pendingCallOffer = null;
            callTargetId = null;
            iceCandidatesQueue = [];
            setCallStatus('Соединение...');

            setTimeout(() => { callClosing = false; }, 100);
        }

        // Настройки
        const settingsBtn = document.getElementById('settings-btn');
        const settingsModal = document.getElementById('settings-modal');
        const closeSettingsBtn = document.getElementById('close-settings-btn');

        settingsBtn.onclick = () => settingsModal.classList.remove('hidden');
        closeSettingsBtn.onclick = () => settingsModal.classList.add('hidden');

        // Переключение тем
        const themeDarkBtn = document.getElementById('theme-dark-btn');
        const themeLightBtn = document.getElementById('theme-light-btn');
        const appBody = document.getElementById('app-body');

            themeLightBtn.className = 'flex-1 py-2 px-3 rounded-xl border border-slate-700 bg-slate-800 text-xs font-semibold text-slate-300';
        };

        themeLightBtn.onclick = () => {
            appBody.classList.remove('dark');
            appBody.classList.replace('bg-slate-950', 'bg-slate-100');
            themeLightBtn.className = 'flex-1 py-2 px-3 rounded-xl border border-blue-500/50 bg-blue-600/20 text-xs font-semibold text-blue-500';
            themeDarkBtn.className = 'flex-1 py-2 px-3 rounded-xl border border-slate-300 bg-slate-200 text-xs font-semibold text-slate-700';
        };

        // Загрузка аватарки
        const uploadAvatarBtn = document.getElementById('upload-avatar-btn');
        const avatarInput = document.getElementById('avatar-input');

        uploadAvatarBtn.onclick = () => avatarInput.click();

        avatarInput.onchange = (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (event) => {
                myCustomAvatar = event.target.result;
                updateMyAvatarUI();

                const userDataRaw = localStorage.getItem('user_account_' + myId);
                if (userDataRaw) {

                    userData.avatar = myCustomAvatar;

                alert('Аватарка успешно обновлена!');
            };
            reader.readAsDataURL(file);
        };

        // Запись голосовых
        let mediaRecorder, audioChunks = [], isRecording = false, recTimerInterval, seconds = 0;
        let micMeterContext = null, micMeterSource = null, micMeterAnalyser = null, micMeterRAF = null;

        function stopMicLevelMeter() {
            if (micMeterRAF) cancelAnimationFrame(micMeterRAF);
            micMeterRAF = null;
            if (micMeterSource) { try { micMeterSource.disconnect(); } catch(e) {} }
            micMeterSource = null;
            micMeterAnalyser = null;
            const rects = [document.getElementById('mic-level-rect'), document.getElementById('call-mic-level-rect')];
            rects.forEach(r => { if (r) { r.setAttribute('y','24'); r.setAttribute('height','0'); } });
        }

        function startMicLevelMeter(stream, target = 'record') {
            stopMicLevelMeter();
            try {
                micMeterContext = micMeterContext || new (window.AudioContext || window.webkitAudioContext)();
                if (micMeterContext.state === 'suspended') micMeterContext.resume().catch(() => {});
                micMeterSource = micMeterContext.createMediaStreamSource(stream);
                micMeterAnalyser = micMeterContext.createAnalyser();
                micMeterAnalyser.fftSize = 256;
                micMeterAnalyser.smoothingTimeConstant = 0.72;
                micMeterSource.connect(micMeterAnalyser);
                const data = new Uint8Array(micMeterAnalyser.fftSize);
                const tick = () => {
                    if (!micMeterAnalyser) return;
                    micMeterAnalyser.getByteTimeDomainData(data);
                    let sum = 0;
                    for (let i = 0; i < data.length; i++) { const v = (data[i] - 128) / 128; sum += v * v; }
                    const rms = Math.sqrt(sum / data.length);
                    const level = Math.min(1, Math.max(0, (rms - 0.008) * 5.2));
                    const rect = document.getElementById(target === 'call' ? 'call-mic-level-rect' : 'mic-level-rect');
                    if (rect) { const h = Math.max(0, 24 * level); rect.setAttribute('y', String(24 - h)); rect.setAttribute('height', String(h)); }
                    micMeterRAF = requestAnimationFrame(tick);
                };
                tick();
            } catch(e) {}
        }
        const micBtn = document.getElementById('mic-btn');
        const recTimer = document.getElementById('rec-timer');
        const micIcon = document.getElementById('mic-icon');

        micBtn.onclick = async () => {
            if (!currentChat) return alert('Выбери чат из списка!');

            if (!isRecording) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    startMicLevelMeter(stream, 'record');
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];

                    mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                    
                    mediaRecorder.onstop = () => {
                        const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                        const reader = new FileReader();
                        reader.readAsDataURL(audioBlob);
                        reader.onloadend = () => {
                            const base64Audio = reader.result;
                            sendPayload(base64Audio, 'audio', 'Голосовое сообщение.webm', audioBlob.size);
                        };
                        stopMicLevelMeter();
                        stream.getTracks().forEach(track => track.stop());
                    };

                    mediaRecorder.start();
                    isRecording = true;
                    micBtn.classList.add('is-recording');
                    micBtn.classList.add('animate-pulse');
                    recTimer.classList.remove('hidden');

                    seconds = 0;
                    recTimer.textContent = '00:00';
                    recTimerInterval = setInterval(() => {
                        seconds++;
                        let m = String(Math.floor(seconds / 60)).padStart(2, '0');
                        let s = String(seconds % 60).padStart(2, '0');
                        recTimer.textContent = `${m}:${s}`;
                    }, 1000);

                } catch (err) {
                    alert('Не удалось получить доступ к микрофону!');
                }
            } else {
                mediaRecorder.stop();
                isRecording = false;
                micBtn.classList.remove('is-recording');
                micBtn.classList.remove('animate-pulse');
                recTimer.classList.add('hidden');
                stopMicLevelMeter();
                clearInterval(recTimerInterval);
            }
        };

        function renderUsers() {
            const container = document.getElementById('users-list');
            container.innerHTML = '';
            onlineUsers.forEach(u => {
                const badge = document.createElement('div');
                const firstLetter = u.name.charAt(0).toUpperCase();
                const avatarColor = getColorForName(u.name);

                badge.className = 'flex items-center gap-1 bg-slate-900 border border-slate-800 px-2 py-0.5 rounded-lg text-[11px] text-slate-200 animate-fade-in';
                badge.innerHTML = `<span class="w-3.5 h-3.5 rounded-md flex items-center justify-center text-[8px] font-bold ${avatarColor}">${firstLetter}</span><span>${escapeHTML(u.name)}</span>`;
                container.appendChild(badge);
            });
        }

        function cleanUsers() {
            const now = Date.now();
            onlineUsers.forEach((u, id) => { if (now - u.time > 5000) onlineUsers.delete(id); });
            renderUsers();
        }

        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag));
        }
    </script>
